# IT-Tools：80 多个开发者小工具，全部在浏览器本地计算，无账号、无存储、不出网。
services:
  it-tools:
    # 上游官方镜像（GPL-3.0，nginx:alpine 底座），按 amd64/arm64 清单列表摘要固定，2024.10.22 后上游未再发版。
    image: ghcr.io/corentinth/it-tools:2024.10.22-7ca5933@sha256:8b8128748339583ca951af03dfe02a9a4d7363f61a216226fc28030731a5a61f
    # 应用是无状态的纯静态页面，根文件系统只读；nginx 自己要写的三处（缓存、pid、日志）用 tmpfs 兜住。
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,size=32m
      - /var/run:rw,size=8m
      - /var/log/nginx:rw,size=8m
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      start_interval: 1s

x-wonton:
  spec: "0.4"
  id: tech.it-tools.it-tools
  version: 0.1.0
  kind: app
  title: { en: IT Tools }
  description:
    zh: 开发者常用的 80 多个小工具，都在浏览器里本地计算
    en: 80+ handy tools for developers, all computed locally in your browser
  icon: icon.png
  notices: [NOTICE]
  screenshots: [screenshots/home.png]
  author: { name: geraldpeng6, url: https://github.com/geraldpeng6 }
  homepage: https://it-tools.tech
  # 应用（IT-Tools）的许可证（GNU GPLv3 → SPDX GPL-3.0-only）；插件包自己的许可证写在仓库的 LICENSE 里。
  license: GPL-3.0-only
  tags:
    zh: [工具, 开发]
    en: [Tools, Developer]
  about:
    zh: |
      JSON 和 YAML 转换、文本加解密、哈希、二维码、颜色和单位换算、时间戳……80 多个开发者常用的小工具，打开就用，不用注册。

      所有计算都在你浏览器的页面里完成，内容不经过服务器，也不落任何存储。
    en: |
      JSON and YAML conversion, encryption, hashing, QR codes, color and unit conversion, timestamps and more — 80+ handy developer tools, ready on open, no account needed.

      Everything is computed in your browser's page: nothing reaches the server, nothing is stored.
  release_notes: { zh: 第一版。, en: First release. }
  webui:
    service: it-tools
    port: 80
    # 应用没有账号体系，所有工具本地计算；网页仍只在网关登录后面可达。
    sso: none
  permissions: []
  # 上游没写最低内存；本机空闲实测约 31M，取 64M。镜像支持 amd64 和 arm64（docker manifest inspect）。
  requirements:
    arch: [amd64, arm64]
    memory: 64M
